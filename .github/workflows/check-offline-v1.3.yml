name: Validar Offline First V1.3
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: |
          node --check app.js
          node --check offline.js
          node --check sw.js
      - name: Validar manifesto e referências
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest'));if(!m.start_url||m.icons.length<2)process.exit(1);for(const i of m.icons){if(!fs.existsSync(i.src.replace(/^\.\//,'')))process.exit(2)}"

      - name: Testar cofre criptografado e fila local
        run: node tests/test_offline_crypto.cjs
