name: Publicar OT Comercial (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ot-comercial-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar site estatico
        run: |
          mkdir -p _site
          cp index.html app.js style.css config.js robots.txt apresentacao-ot.html apresentacao-servico.css _site/
          cp -R solucoes _site/
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/config.js
          test -s _site/apresentacao-ot.html
          test -s _site/solucoes/cardapio.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
