name: OT Gate D — Campo Offline HTTPS Simulado

on:
  push:
    branches: [feat/v1-5-integracao-premium-offline]

concurrency:
  group: ot-field-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  field-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simular CRM completo sem tocar no Supabase real
        run: node tests/qa-field-http-e2e.mjs
      - name: Guardar capturas de dados fictícios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-d-campo-ficticio
          path: artifacts/gate-d-field/*.png
          if-no-files-found: warn
          retention-days: 7
