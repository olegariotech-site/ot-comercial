name: Gate V1.4 Premium Sales Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/v1-4-vitrine-premium]

permissions:
  contents: read

jobs:
  qa-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar vitrine, cards e integridade de arquivos
        run: node --test tests/qa-premium.test.mjs
